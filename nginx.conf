server {
    listen 80;
    server_name _;

    # Masquer la version nginx dans les en-têtes et pages d'erreur
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour les assets statiques
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── Assets Vite : hash dans le nom → cache immuable 1 an ─────────────────
    # Uniquement le dossier /assets/ généré par Vite (fichiers à empreinte)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── Icônes et images publiques ────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── Service Worker, manifeste, registerSW : pas de cache ─────────────────
    # Ces fichiers doivent toujours être re-vérifiés pour permettre les mises
    # à jour de la PWA. Un cache long bloquerait le bandeau "Nouvelle version".
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── SPA fallback : toutes les routes inconnues → index.html ──────────────
    # index.html en no-cache : le navigateur vérifie à chaque ouverture
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── Health check pour Docker / Traefik ───────────────────────────────────
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── Favicon : pas de log ──────────────────────────────────────────────────
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
