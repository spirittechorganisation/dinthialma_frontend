# Intégration continue : vérifie chaque PR avant le merge (spec 01 tâche 5.2, spec 03 tâche 4).
#
# Flux : sous-branche → develop → main. Ce workflow tourne sur toute PR vers develop
# ou main, quel que soit le préfixe de la branche (feature/, fix/, chore/, dependabot/…).
# Il ne déploie rien : le déploiement reste dans docker-publish.yml (push sur main).
#
# À compléter quand la branche feature/front-filet-de-tests (spec 01) sera mergée :
#   - `npm run lint` (ESLint 9+ et eslint.config.js n'existent pas encore sur develop)
#   - `npm run test:coverage` + rapport de couverture en artefact
#   - `node-version-file: .nvmrc` (Node 24, tâche 3.1 de la spec 03)

name: CI – Frontend

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité (typage + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même version que l'image de build du Dockerfile (node:20-alpine)
          node-version: 20
          cache: npm

      - name: Installation (lock respecté)
        run: npm ci

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build

  securite:
    name: Sécurité des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # Bloquant sur les vulnérabilités CRITIQUES des dépendances de production.
      # Seuil provisoire : zod 3 porte une vulnérabilité élevée (GHSA-mrhx-c7xc-m3w5)
      # corrigée par la montée en zod 4 (spec 03, tâche 6.1). Passer à
      # --audit-level=high une fois cette tâche faite.
      - name: Audit des dépendances de production (critique = bloquant)
        run: npm audit --omit=dev --audit-level=critical

      - name: Rapport complet (non bloquant)
        if: always()
        run: npm audit --omit=dev || true

  # Déploiement « à blanc » : vérifie AVANT le merge ce que docker-publish.yml ne vérifie
  # qu'au push sur main (incident du 18/11 : la #41 a cassé le déploiement sans signe avant).
  # Les actions sont épinglées sur les MÊMES SHA que docker-publish.yml : toute mise à jour
  # doit être faite dans les deux fichiers à la fois.
  deploiement-a-blanc:
    name: Déploiement à blanc (image Docker, sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dinthialma-frontend-ci
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Valeur publique fictive : aucun secret n'est nécessaire pour vérifier le build
          build-args: |
            VITE_API_URL=https://api.example.invalid
            BUILD_DATE=${{ github.run_id }}
          cache-from: type=gha,scope=buildkit-ci
          cache-to: type=gha,mode=min,scope=buildkit-ci

      # Sondes : ces actions ont besoin de secrets, elles ne sont donc pas exécutées.
      # Le runner les télécharge quand même au démarrage du job (« Set up job ») :
      # une action refusée par l'organisation ou une référence invalide fait échouer
      # ce job ici, et non plus le déploiement sur main.
      - name: Sonde – login Docker Hub (non exécutée)
        if: ${{ false }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0

      - name: Sonde – déploiement SSH (non exécutée)
        if: ${{ false }}
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
