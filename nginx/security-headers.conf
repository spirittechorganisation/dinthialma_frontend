# ─── En-têtes de sécurité ─────────────────────────────────────────────────────
# À inclure dans chaque bloc location (un add_header dans une location
# annule les add_header du niveau serveur — cf. doc nginx).
#
# CSP en mode Report-Only pendant la phase de validation (console navigateur).
# Passer en Content-Security-Policy une fois confirmé qu'aucune ressource
# légitime n'est bloquée.

# Politique de sécurité du contenu (mode observation)
add_header Content-Security-Policy-Report-Only
    "default-src 'self'; "
    "script-src 'self'; "
    "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
    "font-src 'self' https://fonts.gstatic.com; "
    "img-src 'self' data: blob:; "
    "connect-src 'self' $VITE_API_URL_PLACEHOLDER; "
    "worker-src 'self'; "
    "frame-ancestors 'none'; "
    "base-uri 'self'; "
    "form-action 'self';"
    always;

# Empêche le sniffing MIME
add_header X-Content-Type-Options "nosniff" always;

# Politique de référent : transmet l'origine seulement sur HTTPS → HTTPS
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions : caméra autorisée (scanner QR), géolocalisation et micro refusés
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

# Interdit l'intégration dans une iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
